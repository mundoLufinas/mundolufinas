<body class="portal-home">
<div id="site-header"></div>


<main>
  <section class="vitrine-hero">
    <div class="container">
      <span class="hero-kicker">ESCOLHAS DA LU</span>
      <h1>Produtos pesquisados para facilitar suas escolhas.</h1>
      <p>Use a busca, filtre por categoria e compare com calma. Os produtos abaixo são carregados diretamente do nosso catálogo.</p>
    </div>
  </section>

  <section class="container vitrine-area">
    <div class="vitrine-tools">
      <div class="vitrine-busca">
        <i class="fas fa-search"></i>
        <input id="buscaVitrine" type="search" placeholder="Buscar na vitrine..." aria-label="Buscar produtos na vitrine">
      </div>
      <select id="categoriaVitrine" aria-label="Filtrar por categoria">
        <option value="">Todas as categorias</option>
      </select>
      <select id="ordemVitrine" aria-label="Ordenar produtos">
        <option value="recentes">Mais recentes</option>
        <option value="menor">Menor preço</option>
        <option value="maior">Maior preço</option>
        <option value="az">Nome A–Z</option>
      </select>
    </div>

    <div class="vitrine-meta">
      <div><h2>Vitrine de produtos</h2><p id="qtdVitrine">Carregando produtos...</p></div>
      <a href="index.html">← Voltar para o portal</a>
    </div>

    <div id="gradeVitrine" class="vitrine-grid" aria-live="polite"></div>
    <div id="paginacaoVitrine" class="vitrine-paginacao"></div>
    <p class="vitrine-afiliado">Publicidade | Links de afiliado</p>
  </section>
</main>


<div id="site-footer"></div>


<script>
(function(){
  const grade=document.getElementById('gradeVitrine');
  const qtd=document.getElementById('qtdVitrine');
  const busca=document.getElementById('buscaVitrine');
  const categoria=document.getElementById('categoriaVitrine');
  const ordem=document.getElementById('ordemVitrine');
  const pag=document.getElementById('paginacaoVitrine');
  const POR_PAGINA=24;
  let todos=[], pagina=1;

  const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
  const numero=v=>{
    if(typeof v==='number') return v;
    let s=String(v??'').trim().replace(/[R$\s]/g,'');
    if(s.includes(',') && s.includes('.')) s=s.replace(/\./g,'').replace(',','.');
    else if(s.includes(',')) s=s.replace(',','.');
    return Number(s)||0;
  };
  const moeda=v=>numero(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  const ativo=p=>p && (p.ativo===true || String(p.ativo).toLowerCase()==='true' || String(p.status||'').toUpperCase()==='ATIVO');

  function categoriaDo(p){return String(p.categoria||p.Categoria||'Outros').trim()||'Outros'}
  function linkDo(p){return p.link||p.afiliado||p.linkAfiliado||p.url||'#'}
  function textoLoja(p){
    const loja=String(p.loja||'Mercado Livre').trim();
    const l=loja.toLowerCase();
    if(l.includes('amazon')) return 'Veja na AMAZON';
    if(l.includes('shopee')) return 'Veja na Shopee';
    if(l.includes('mercado livre')) return 'Veja no MERCADO LIVRE';
    return 'Veja em ' + loja;
  }
  function imagemDo(p){let s=String(p.imagem||p.foto||'').replace(/^\.\//,''); return s || 'img/logo-mundo-lufinas.png'}
  function precoDo(p){return p.precoPromocional||p.preco||p.preço||0}

  function filtrados(){
    const termo=busca.value.trim().toLowerCase(), cat=categoria.value;
    let arr=todos.filter(p=>(!termo || String(p.nome||p.titulo||'').toLowerCase().includes(termo)) && (!cat || categoriaDo(p)===cat));
    if(ordem.value==='menor') arr.sort((a,b)=>numero(precoDo(a))-numero(precoDo(b)));
    else if(ordem.value==='maior') arr.sort((a,b)=>numero(precoDo(b))-numero(precoDo(a)));
    else if(ordem.value==='az') arr.sort((a,b)=>String(a.nome||a.titulo||'').localeCompare(String(b.nome||b.titulo||''),'pt-BR'));
    else arr.sort((a,b)=>Number(b.ordem||b.id||0)-Number(a.ordem||a.id||0));
    return arr;
  }

  function render(){
    const arr=filtrados(), totalPag=Math.max(1,Math.ceil(arr.length/POR_PAGINA));
    if(pagina>totalPag) pagina=1;
    qtd.textContent=arr.length+' produto'+(arr.length===1?' encontrado':'s encontrados');
    const inicio=(pagina-1)*POR_PAGINA;
    const fatia=arr.slice(inicio,inicio+POR_PAGINA);
    grade.innerHTML=fatia.length?fatia.map(p=>`
      <article class="vitrine-card">
        <a href="${esc(linkDo(p))}" target="_blank" rel="sponsored noopener" aria-label="Ver ${esc(p.nome||p.titulo||'produto')}">
          <img src="${esc(imagemDo(p))}" alt="${esc(p.alt||p.nome||p.titulo||'Produto')}" loading="lazy">
        </a>
        <div class="vitrine-card-body">
          <span class="vitrine-loja">${esc(categoriaDo(p))}</span>
          <h3>${esc(p.nome||p.titulo||'Produto')}</h3>
          <div class="vitrine-preco">${esc(moeda(precoDo(p)))}</div>
          <a class="portal-btn" href="${esc(linkDo(p))}" target="_blank" rel="sponsored noopener">${esc(textoLoja(p))}</a>
        </div>
      </article>`).join(''):'<div class="vitrine-vazio">Nenhum produto encontrado com esses filtros.</div>';

    pag.innerHTML='';
    if(totalPag>1){
      for(let i=1;i<=totalPag;i++){
        const b=document.createElement('button'); b.textContent=i; if(i===pagina)b.className='ativa';
        b.onclick=()=>{pagina=i;render();window.scrollTo({top:document.querySelector('.vitrine-area').offsetTop-20,behavior:'smooth'})};
        pag.appendChild(b);
      }
    }
  }

  fetch('produtos.json',{cache:'no-store'})
    .then(r=>{if(!r.ok)throw new Error('produtos.json: '+r.status);return r.json()})
    .then(dados=>{
      const lista=Array.isArray(dados)?dados:(dados.produtos||[]);
      todos=lista.filter(ativo);
      [...new Set(todos.map(categoriaDo))].sort((a,b)=>a.localeCompare(b,'pt-BR')).forEach(c=>{
        const o=document.createElement('option');o.value=c;o.textContent=c;categoria.appendChild(o);
      });
      render();
    })
    .catch(e=>{console.error(e);qtd.textContent='Não foi possível carregar o catálogo.';grade.innerHTML='<div class="vitrine-vazio">Confira se o arquivo produtos.json está na mesma pasta da vitrine.html.</div>'});

  [busca,categoria,ordem].forEach(el=>el.addEventListener(el===busca?'input':'change',()=>{pagina=1;render()}));
})();
</script>
